<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product Finder — Visual Search</title>
<style>
  :root {
    --bg: #0b0d12;
    --card: #151822;
    --border: #262b3a;
    --text: #e8eaf0;
    --muted: #9aa0b4;
    --accent: #6c8dff;
    --accent2: #46e39a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1200px 600px at 20% -10%, #1a2036 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 20px 80px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 36px; }
  header h1 {
    font-size: 2rem;
    margin: 0 0 8px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p { color: var(--muted); margin: 0; }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
  }
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 36px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .dropzone:hover, .dropzone.drag { border-color: var(--accent); background: #171b28; }
  .dropzone input { display: none; }
  .dropzone .hint { color: var(--muted); font-size: .9rem; margin-top: 8px; }
  #preview {
    max-width: 240px;
    max-height: 240px;
    border-radius: 10px;
    margin: 0 auto 14px;
    display: none;
    border: 1px solid var(--border);
  }
  .actions { margin-top: 20px; display: flex; gap: 12px; justify-content: center; }
  button {
    background: linear-gradient(90deg, var(--accent), #8a6cff);
    color: #fff;
    border: none;
    padding: 12px 26px;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  #status { text-align: center; color: var(--muted); margin-top: 16px; min-height: 20px; }
  #results { margin-top: 36px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card img { width: 100%; height: 140px; object-fit: contain; background: #0e1118; border-radius: 8px; }
  .card h3 { font-size: .95rem; margin: 0; line-height: 1.3; }
  .card .price { color: var(--accent2); font-weight: 700; }
  .card .source { color: var(--muted); font-size: .8rem; }
  .card a.buy {
    margin-top: auto;
    text-align: center;
    background: #1d2130;
    border: 1px solid var(--border);
    padding: 8px;
    border-radius: 8px;
    text-decoration: none;
    color: var(--text);
    font-size: .85rem;
  }
  .card a.buy:hover { border-color: var(--accent); }
  .section-label { color: var(--muted); font-size: .85rem; text-transform: uppercase; letter-spacing: .06em; margin: 28px 0 10px; }
  .meta { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 10px; }
  footer { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 50px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Product Finder</h1>
    <p>Upload a product photo. Google Lens finds visual matches, AI cleans them into a shortlist.</p>
  </header>

  <div class="panel">
    <label class="dropzone" id="dropzone">
      <img id="preview" alt="preview" />
      <div id="dzText">Click to choose a photo, or drag one here</div>
      <div class="hint">JPG / PNG, under 8MB</div>
      <input type="file" id="fileInput" accept="image/*" />
    </label>
    <div class="actions">
      <button id="searchBtn" disabled>Find this product</button>
      <button id="clearBtn" class="secondary">Clear</button>
    </div>
    <div id="status"></div>
  </div>

  <div id="resultsWrap" style="display:none">
    <div class="section-label">AI-cleaned shortlist</div>
    <div id="cleanResults" class="results-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;"></div>
    <div class="meta" id="meta"></div>
  </div>

  <footer>Google Lens search via SerpApi · cleanup via LLM · Task Forge puzzle #8</footer>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const dropzone = document.getElementById('dropzone');
const preview = document.getElementById('preview');
const dzText = document.getElementById('dzText');
const searchBtn = document.getElementById('searchBtn');
const clearBtn = document.getElementById('clearBtn');
const statusEl = document.getElementById('status');
const resultsWrap = document.getElementById('resultsWrap');
const cleanResults = document.getElementById('cleanResults');
const metaEl = document.getElementById('meta');

let selectedFile = null;

fileInput.addEventListener('change', (e) => {
  if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
});

dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('drag');
  if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});

function handleFile(file) {
  selectedFile = file;
  const reader = new FileReader();
  reader.onload = (ev) => {
    preview.src = ev.target.result;
    preview.style.display = 'block';
    dzText.textContent = file.name;
  };
  reader.readAsDataURL(file);
  searchBtn.disabled = false;
  resultsWrap.style.display = 'none';
  cleanResults.innerHTML = '';
  statusEl.textContent = '';
}

clearBtn.addEventListener('click', () => {
  selectedFile = null;
  fileInput.value = '';
  preview.style.display = 'none';
  dzText.textContent = 'Click to choose a photo, or drag one here';
  searchBtn.disabled = true;
  resultsWrap.style.display = 'none';
  cleanResults.innerHTML = '';
  statusEl.textContent = '';
});

searchBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  searchBtn.disabled = true;
  statusEl.textContent = 'Uploading image and querying Google Lens...';
  resultsWrap.style.display = 'none';
  cleanResults.innerHTML = '';

  try {
    const fd = new FormData();
    fd.append('image', selectedFile);
    const res = await fetch('/api/search', { method: 'POST', body: fd });
    if (!res.ok) {
      const errText = await res.text();
      throw new Error(errText || ('HTTP ' + res.status));
    }
    const data = await res.json();
    statusEl.textContent = '';

    if (data.cleaned && data.cleaned.length) {
      data.cleaned.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          ${item.thumbnail ? `<img src="${item.thumbnail}" alt="">` : ''}
          <h3>${escapeHtml(item.name || 'Unknown product')}</h3>
          ${item.price ? `<div class="price">${escapeHtml(item.price)}</div>` : '<div class="price" style="color:#9aa0b4">Price not listed</div>'}
          ${item.source ? `<div class="source">${escapeHtml(item.source)}</div>` : ''}
          ${item.link ? `<a class="buy" href="${item.link}" target="_blank" rel="noopener">View / Buy</a>` : ''}
        `;
        cleanResults.appendChild(card);
      });
    } else {
      cleanResults.innerHTML = '<p style="color:#9aa0b4">No confident product matches found.</p>';
    }
    metaEl.textContent = `${data.rawMatchCount || 0} raw visual matches from Google Lens -> ${(data.cleaned||[]).length} cleaned results via ${data.cleanupModel || 'AI'}`;
    resultsWrap.style.display = 'block';
  } catch (err) {
    statusEl.textContent = 'Error: ' + err.message;
  } finally {
    searchBtn.disabled = false;
  }
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
